name: automarket

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: automarket_backend
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: automarket
      DB_USERNAME: automarket_user
      DB_PASSWORD: secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automarket-network

  nginx:
    image: nginx:alpine
    container_name: automarket_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - automarket-network

  postgres:
    image: postgres:16-alpine
    container_name: automarket_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: automarket
      POSTGRES_USER: automarket_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automarket_user -d automarket"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - automarket-network

  redis:
    image: redis:7-alpine
    container_name: automarket_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - automarket-network

networks:
  automarket-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
